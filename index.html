<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stelian Matei - Under Construction</title>
    <style>
        body {
            font-family: 'Open Sans', sans-serif; /* Professional, clean sans-serif font */
            background-color: #f4f4f4; /* Light grey background */
            color: #333; /* Dark grey text */
            margin: 0; /* Remove default body margin */
            padding: 0; /* Remove default body padding */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure content is centered vertically */
        }

        .container {
            text-align: center;
            padding: 40px;
            background-color: #fff; /* White container background */
            border-radius: 8px; /* Slightly rounded corners */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15); /* Subtle shadow */
            max-width: 600px; /* Limit container width */
            width: 90%; /* Responsive width */
        }

        h1 {
            font-family: 'Montserrat', sans-serif; /* Slightly bolder font for the heading */
            font-size: 2.5em;
            margin-bottom: 0.5em;
            color: #4285f4; /* Google Blue for a professional touch */
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 2em;
        }

        .linkedin-link {
            display: inline-block; /* Allows padding and margin */
            padding: 10px 20px;
            background-color: #0a66c2; /* LinkedIn Blue */
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }

        .linkedin-link:hover {
            background-color: #0752a3; /* Darker blue on hover */
        }

        /* Styling for the LinkedIn logo */
        .linkedin-link i {
             margin-right: 8px;
              vertical-align: middle; /* Center the icon vertically */
        }

        .under-construction-img {
             width: 80%; /*Responsive width*/
             max-width: 300px;  /* Limit the maximum image width */
             height: auto; /* Maintain aspect ratio */
             margin-bottom: 20px;
        }
         /* Add some responsive design rules */
         @media (max-width: 768px) {
                .container {
                    padding: 20px;  /*Reduced the ammount of padding*/
                }

               h1 {
                 font-size: 2em; /* Reduce heading size */
               }
         }


    </style>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container">
        <h1>Stelian Matei</h1>
<p>This website is currently under construction.  Please check back later!</p>
        <p>In the meantime, you can connect with me on LinkedIn:</p>
        <a href="https://www.linkedin.com/in/stelian-matei/" class="linkedin-link" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-linkedin"></i>Connect on LinkedIn
        </a>
    </div>
</body>
</html>
